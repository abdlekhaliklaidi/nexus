<div (click)="navigateToDetails()" 
     class="bg-white/5 border border-white/10 hover:border-white/20 rounded-xl p-4 transition-all duration-200 cursor-pointer flex flex-col justify-between h-full group relative overflow-hidden">
  
  <div>
    <!-- Image Preview -->
    <div class="aspect-square w-full rounded-lg bg-black/40 overflow-hidden mb-4 border border-white/5 relative">
      <img [src]="primaryImage" 
           [alt]="product.name || 'Product Image'"
           (error)="onImageError($event)"
           class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
    </div>

    <!-- Product Details -->
    <h3 class="text-white font-bold text-lg tracking-wide truncate">
      {{ product.name || 'Untitled Product' }}
    </h3>
    <p class="text-gray-400 text-xs mt-1 min-h-[32px]">
      {{ truncatedDescription || 'No description provided.' }}
    </p>
  </div>

  <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between">
    <div>
      <span class="text-xs text-gray-400 block font-mono uppercase">Price</span>
      <span class="text-white font-black text-lg">{{ product.price || 0 }} $</span>
    </div>

    <!-- Owner / Admin Delete Button -->
    <div *ngIf="isOwner ">
      <button (click)="openDeleteConfirm($event)"
              class="text-xs font-mono uppercase tracking-wider text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-3 py-1.5 rounded-md transition flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        
      </button>
    </div>
  </div>

  <!-- Custom AP-Styled Delete Confirm Modal Overlay -->
  <div *ngIf="showDeleteConfirm" 
       (click)="$event.stopPropagation()"
       class="absolute inset-0 bg-[#0a1120]/95 backdrop-blur-sm z-20 p-5 flex flex-col justify-between rounded-xl border border-red-500/30 animate-in fade-in duration-150">
    
    <div class="flex flex-col items-center justify-center flex-1 text-center">
      <div class="w-10 h-10 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center mb-3 text-red-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>

      <h4 class="text-sm font-bold text-white uppercase tracking-wider">Remove Product?</h4>
      <p class="text-xs text-gray-400 mt-1 max-w-[200px] line-clamp-2">
        "{{ product.name }}" will be permanently deleted from the catalog.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/10">
      <button (click)="cancelDelete($event)" 
              class="w-full text-xs font-mono uppercase tracking-wider text-gray-300 hover:text-white bg-white/5 hover:bg-white/10 py-2 rounded-lg transition border border-white/10">
        Cancel
      </button>
      <button (click)="confirmDelete($event)" 
              class="w-full text-xs font-mono uppercase tracking-wider text-white bg-red-600 hover:bg-red-500 py-2 rounded-lg transition shadow-lg shadow-red-900/30 font-bold">
        Confirm
      </button>
    </div>
  </div>

</div>
